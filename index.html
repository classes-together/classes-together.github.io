---
layout: default
title: Home
---

<section class="page home">
  <div class="home-hero">
    <h1>Classes Together</h1>
    <p class="tagline">Conveniently Collaborate with Your Classmates</p>
    <a class="photo-credit"
       href="{{ '/references.html' | relative_url }}#perry-library">Photo: Old Dominion University</a>
    <a class="learn-more" href="{{ '/about.html' | relative_url }}">Learn More →</a>
  </div>

  <div class="features-grid">
    {% for feature in site.data.features %}
      <div class="feature">
        <img src="{{ feature.icon | relative_url }}"
             alt="{{ feature.alt | escape }}"
             class="feature-icon" />

        <h2>{{ feature.title | escape }}</h2>
        <p>{{ feature.description | escape }}</p>
      </div>
    {% endfor %}
  </div>

</section>
