<nav>
  <div>
    <a href="{{ '/' | relative_url }}" {% if page.url == '/' %} aria-current="page" {% endif %}>Home</a>
    <a href="{{ '/about.html' | relative_url }}" {% if page.url == '/about.html' %} aria-current="page" {% endif %}>About</a>
    <a href="{{ '/team.html' | relative_url }}" {% if page.url == '/team.html' %} aria-current="page" {% endif %}>Team</a>

    {% assign presentation_groups = site.data.documents | where: "page", "presentations" %}

      <div class="nav-dropdown">
        <a href="{{ '/presentations.html' | relative_url }}" {% if page.url == '/presentations.html' %} aria-current="page" {% endif %}>Presentations</a>

        <div class ="nav-dropdown-menu">
          {% for group in presentation_groups %}
            <a href="{{ '/presentations.html' | relative_url}}#{{ group.id }}">
              {{ group.title | escape }}
            </a>
          {% endfor %}
        </div>
      </div>

    <a href="{{ '/deliverables.html' | relative_url }}" {% if page.url == '/deliverables.html' %} aria-current="page" {% endif %}>Deliverables</a>
    <a href="{{ '/references.html' | relative_url }}" {% if page.url == '/references.html' %} aria-current="page" {% endif %}>References</a>
  </div>
</nav>
