#   type      - Reference type (web-article)
#   authors   - Author(s) or organization.
#   year      - Publication year.
#   month     - Publication month.
#   day       - Publication day.
#   title     - Title of article.
#   source    - Website or publisher.
#   url       - Original source URL.
web:
  - id: pronto-2021
    type: web-article
    authors: "Pronto"
    year: 2021
    month: "May"
    day: 17
    title: "Communication: A key element of student success in higher education"
    source: Pronto
    url: "https://pronto.io/communication-key-element-student-success/"


