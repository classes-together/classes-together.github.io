# Reference Page
#
# Top-level keys:
#   academic    - Academic papers and journal articles.
#   web         - Websites and online articles.
#   media       - Images, icons, and other visual assets.


# Academic Research References
#
# Fields:
#   id        - Unique identifier.
#   type      - Reference type (journal-article).
#   authors   - Author(s) of the publication.
#   year      - Publication year.
#   title     - Title of the publication.
#   journal   - Journal name.
#   volume    - Journal volume.
#   issue     - Journal issue.
#   pages     - Page range.
#   doi       - DOI link.
academic:
  - id: lav-2025
    type: journal-article
    authors: "Lav, N. S., Schiefer, E. J., Das, S., Vancheeswaran, N., Ahmad, S., Nguyen, M., & Nicholas, A."
    year: 2025
    title: "Undergraduate learning assistants using online messaging improves student educational experiences in large neuroscience lecture course"
    journal: "Journal of Undergraduate Neuroscience Education"
    volume: 23
    issue: 2
    pages: "A50-A55"
    doi: "https://doi.org/10.59390/VWEM4773"

  - id: leroux-2022
    type: journal-article
    authors: "le Roux, D. B., & Parry, D. A."
    year: 2022
    title: "An exploratory investigation of the use and effects of academic instant messaging groups among university students"
    journal: "Education and Information Technologies"
    volume: 27
    issue: 1
    pages: "1055-1080"
    doi: "https://doi.org/10.1007/s10639-021-10631-y"

# Web Source References
#
# Fields:
