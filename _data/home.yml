# Home Page
#
# Top-level keys:
#   hero      - The top section of the home page.
#   features  - Features underneath the hero.

# Hero
#
# Fields:
#   title         - Main heading displayed in the hero section.
#   tagline       - Subtitle displayed underneath the title.
#   photo_credit  - Providing credit for the background image used.
#     text        - The displayed text for the credit.
#     url         - Link to the image source.
#   button        - The button underneath the hero heading and tagline.
#     text        - Label for the button.
#     url         - Button destination when clicked.
hero:
  title: Classes Together
  tagline: Conveniently Collaborate with Your Classmates

  photo_credit:
    text: "Photo: Old Dominion University"
    url: "/references/#ref-perry-library"

  button:
    text: Learn More &rarr;
    url: /about/

# Features
#
#   title         - Feature heading
#   description   - Short description of the feature
#   alt           - Alternative text for the feature icon.
#   icon          - Path to the feature's icon, relative to the website root.
features:
  - title: Course Communities
    description: Automatically access communities for all courses you're currently enrolled in.
    alt: ""
    icon: /assets/icons/user-round-group.svg

  - title: Connect & Collaborate
    description: Ask questions, share resources, and organize study sessions.
    alt: ""
    icon: /assets/icons/messages-circle.svg

  - title: Semester Based
    description: Communities are created for a specific course and semester, keeping discussions relevant.
    alt: ""
    icon: /assets/icons/calendar-range.svg

overview:
  title: Project Overview

  elevator_pitch:
    title: Elevator Pitch
    description: >-
      Classes Together creates a convenient space for informal academic discussion and streamline invitations. There are
      not many easy or convenient ways for students to communicate informally with their classmates outside of class.
      Additionally, invitations from other informal platforms are time-consuming to send and do not always stay open.
      Classes Together automatically enrolls students in forums for their current classes, which stay open to join for
      the full class duration.

  problem:
    title: Problem Description
    paragraphs:
      - text: >-
          Learning management systems (LMS) are for formal academic discussion and discourage students from asking
          questions due to their strict atmosphere.
        citation: lav-2025

      - text: >-
          Informal instant messaging platforms provide a relaxed atmosphere, but they are not originally intended for
          academics or come with courses built in.

      - text: >-
          LMS only allow instructors or administrators to customize courses. While instant messengers allow user
          customization, popular options do not have built-in academic features.

      - text: >-
          Only LMS instructors or administrators may create invites. And while users on instant messengers may,
          invititations must be manually sent out and typically expire, causing students to miss invitations.

  audience:
    title: Customer and End User

    customer:
      title: Customer
      description: Colleges/Universities

    end_user:
      title: End-User
      description: College/University students

  solution:
    title: Solution Statement
    description: >-
      Classes Together will eliminate the time lost by manually sending out invitations and reentry of course and
      academic information into a new profile. It will also provide an informal setting that is still academic oriented.
